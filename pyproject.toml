[project]
name = "sepa-bot"
version = "0.1.0"
description = "Minervini SEPA screener: Stage 2 trend + VCP setup detection for Nasdaq stocks"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "squarify>=0.4.3",
    "weasyprint>=62.0",
    "feedparser>=6.0",
]

[project.scripts]
sepa = "sepa.macro:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
